<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#22c55e">
  <meta name="description" content="Lista de Supermercado, Planejamento e Controle de Compras — PWA 100% offline.">

  <!-- Metas de app web (Android / iOS) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Compras">
  <title>Compras Inteligentes</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Estilos -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Dependências externas (cacheadas pelo Service Worker) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>

  <!-- Módulos do app -->
  <script src="js/db.js" defer></script>
  <script src="js/charts.js" defer></script>
  <script src="js/views.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>

  <!-- Cabeçalho -->
  <header class="app-header">
    <div class="brand">
      <!-- Ícone de carrinho (SVG) -->
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
      </span>
      <span class="brand-name">Compras<br>Inteligentes</span>
    </div>
    <span id="netBadge" class="badge badge-online">offline</span>
  </header>

  <!-- Conteúdo da SPA -->
  <main id="app">
    <section id="view-plan" class="view active"></section>
    <section id="view-cart" class="view"></section>
    <section id="view-compare" class="view"></section>
    <section id="view-history" class="view"></section>
    <section id="view-dashboard" class="view"></section>
    <section id="view-backup" class="view"></section>
  </main>

  <!-- Navegação inferior -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" data-view="plan" aria-label="Planejamento">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
      <span>Planejar</span>
    </button>
    <button class="nav-btn" data-view="cart" aria-label="Em Compras">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.7 8.5a2 2 0 0 1-2 1.5H9.3a2 2 0 0 1-2-1.6L4.6 3.6A1 1 0 0 0 3.6 3H1"/><circle cx="10" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
      <span>Compras</span>
    </button>
    <button class="nav-btn" data-view="compare" aria-label="Compara Preços">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
      <span>Comparar</span>
    </button>
    <button class="nav-btn" data-view="history" aria-label="Histórico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 3"/></svg>
      <span>Histórico</span>
    </button>
    <button class="nav-btn" data-view="dashboard" aria-label="Dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
      <span>Painel</span>
    </button>
    <button class="nav-btn" data-view="backup" aria-label="Backup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Backup</span>
    </button>
  </nav>

  <!-- Toast de feedback -->
  <div id="toast" class="toast" role="status"></div>

  <!-- Botão de instalação do PWA (aparece via beforeinstallprompt no Android) -->
  <button id="installBtn" class="install-float hidden" data-action="install-app">
    Instalar aplicativo
  </button>

  <!-- Modal genérico de confirmação -->
  <div id="modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <p id="modalMessage"></p>
      <div class="modal-actions">
        <button id="modalCancel" class="btn btn-ghost">Cancelar</button>
        <button id="modalOk" class="btn btn-primary">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Autocompletar de nomes frequentes -->
  <datalist id="suggestNames"></datalist>

</body>
</html>
